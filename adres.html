const street = document.getElementById("street");

street.addEventListener("input", function(e){
    
    e.target.value = e.target.value.replace(/[^a-zA-ZığüşöçİĞÜŞÖÇ\s]/g, "").substring(0,50);
});


        
    

    const citySelect = document.getElementById("city");
    const districtSelect = document.getElementById("district");

    
    Object.keys(cities).forEach(city => {
        const option = document.createElement("option");
        option.value = city;
        option.textContent = city;
        citySelect.appendChild(option);
    });

    
    citySelect.addEventListener("change", function(){
        districtSelect.innerHTML = '<option value="">İlçe Seçiniz</option>'; // temizle
        if(this.value && cities[this.value]){
            cities[this.value].forEach(district => {
                const option = document.createElement("option");
                option.value = district;
                option.textContent = district;
                districtSelect.appendChild(option);
            });
        }
    });

    
    const formAddress = document.getElementById("form-address");
formAddress.addEventListener("submit", function(e){
    e.preventDefault();

    const data = {
        name: fullName.value,
        phone: phone.value,
        city: citySelect.value,
        district: districtSelect.value,
        street: street.value
    };

    
    localStorage.setItem("address", JSON.stringify(data));

   
    const paymentSuccess = document.getElementById("payment-success");
    if(!paymentSuccess){
       
        const msg = document.createElement("p");
        msg.id = "payment-success";
        msg.style.color = "green";
        msg.style.fontWeight = "bold";
        msg.style.marginTop = "10px";
        msg.innerText = "Ödeme Başarılı!";
        formAddress.appendChild(msg);
    } else {
        paymentSuccess.style.display = "block";
        paymentSuccess.innerText = "Ödeme Başarılı!";
    }

    
    localStorage.removeItem("cart");
});
});

document.addEventListener("DOMContentLoaded", function() {
    const backBtn = document.getElementById("back-to-home");
    backBtn.addEventListener("click", function(){
        window.location.href = "index.html"; 
    });
});

</script>

<body>

<header class="header">
<div class="container header-container">

<div class="logo">
<img src="images.jfif" alt="logo">
<h1>ModaStore</h1>
</div>

</div>
</header>

<main class="container">

<section class="cart">



<section id="address-form" style="margin-top:20px;">
    <h2>Teslimat Adresi</h2>
    <form id="form-address">
        <input type="text" id="full-name" placeholder="Ad Soyad" required class="input">
        <input type="text" id="phone" placeholder="Telefon Numarası" required class="input">
        
        <select id="city" required class="input">
            <option value="">Şehir Seçiniz</option>
        </select>

        <select id="district" required class="input">
            <option value="">İlçe Seçiniz</option>
        </select>

        <input type="text" id="street" placeholder="Sokak / Mahalle" required class="input">

        <button type="submit" class="checkout">Kaydet Ve Ödeme Yap</button>

        <button type="button" id="back-to-home" 
        style="margin-top:10px; padding:10px 20px; background:#ff6f61; color:white; border:none; border-radius:6px; cursor:pointer;">
    Ana Menüye Dön
</button>
    </form>
</section>

<p id="order-success" style="display:none;color:green;font-weight:bold;margin-top:10px;">
Siparişiniz başarıyla oluşturuldu 🎉
</p>

</section>

</main>

<footer class="footer">
<p>© 2026 ModaStore</p>
</footer>

<script>

document.getElementById("address-form").addEventListener("submit", function(e){

e.preventDefault();

document.getElementById("order-success").style.display = "block";

localStorage.removeItem("cart");

});

</script>

</body>
</html>
